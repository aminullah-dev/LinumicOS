# LinumicCore tests, the Dari catalog check and the Supabase migrations' grants check on every pull request and every
# push to main. The app target itself is built locally (it needs the signing team); the core package holds the logic.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: LinumicCore tests
        run: swift test --package-path Packages/LinumicCore
      - name: LinumicCore tests with the Persian calendar (as on the owner's Mac)
        run: tools/test/persian-calendar.sh
      - name: Dari translations
        run: python3 tools/l10n/check_catalog.py
      - name: Supabase migrations grant every table they create (Supabase's 2026-10-30 change)
        run: |
          python3 tools/supabase/check_migration_grants.py
          python3 tools/supabase/test_check_migration_grants.py
