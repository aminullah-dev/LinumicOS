name: LinumicCommandCenter
options:
  bundleIdPrefix: com.linumic
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LinumicCore:
    path: Packages/LinumicCore
targets:
  LinumicCommandCenter:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: LinumicCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Linumic Command Center
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: © Linumic
    entitlements:
      path: App/Support/LinumicCommandCenter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linumic.commandcenter
        PRODUCT_NAME: LinumicCommandCenter
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
