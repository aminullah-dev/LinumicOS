name: LinumicCommandCenter
options:
  bundleIdPrefix: com.linumic
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 27RXPRW77S
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LinumicCore:
    path: Packages/LinumicCore
targets:
  LinumicCommandCenter:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - App
    dependencies:
      - package: LinumicCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Linumic Command Center
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fa-AF]
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHumanReadableCopyright: © Linumic
    entitlements:
      path: App/Support/LinumicCommandCenter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linumic.commandcenter
        PRODUCT_NAME: LinumicCommandCenter
        CODE_SIGN_STYLE: Automatic
        # App Sandbox entitlements are macOS-only; iOS apps are sandboxed by the OS.
        CODE_SIGN_ENTITLEMENTS: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/LinumicCommandCenter.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
