name: LinumicOS
options:
  bundleIdPrefix: com.linumic
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 27RXPRW77S
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  LinumicCore:
    path: Packages/LinumicCore
targets:
  LinumicOS:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - App
    dependencies:
      - package: LinumicCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Linumic OS
        # From MARKETING_VERSION / CURRENT_PROJECT_VERSION above (XcodeGen otherwise writes 1.0 (1)).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Linumic OS
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fa-AF]
        LSApplicationCategoryType: public.app-category.developer-tools
        # Supabase backend. The publishable key is designed to ship in apps: row-level security grants nothing without an admin session.
        LCCSupabaseURL: https://mczuclgfqxffcbiwvecf.supabase.co
        LCCSupabasePublishableKey: sb_publishable_VET1GRNWjn6DGk6wK5dsOA_-kiGu63k
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHumanReadableCopyright: © Linumic
        # The Vault asks for Face ID before it shows, copies or fills a saved password (iPhone and iPad).
        NSFaceIDUsageDescription: Linumic OS asks for Face ID before it shows, copies or fills a password saved in the Vault.
        # Automation on iPhone and iPad: a light background refresh (Monitor round, Daily Brief) when iOS allows one.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.linumic.commandcenter.refresh]
    entitlements:
      path: App/Support/LinumicOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # read-write: saving .lnmlic and CSV files where the owner chooses (NSSavePanel).
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Read-only access to the owner's ledgers (the PRIORITIES.md files and NEXT-ACTIONS reports) without a folder
        # picker, granted by the owner on 2026-10-19. A sandbox exception: fine for this privately signed app, not for the
        # Mac App Store. The app still opens only the files on LedgerAllowList inside it.
        com.apple.security.temporary-exception.files.home-relative-path.read-only: [/Projects/Multiplatform/]
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linumic.commandcenter
        PRODUCT_NAME: LinumicOS
        CODE_SIGN_STYLE: Automatic
        # App Sandbox entitlements are macOS-only; iOS apps are sandboxed by the OS.
        CODE_SIGN_ENTITLEMENTS: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/LinumicOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/Support/LinumicOS-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        # App/Resources/Assets.xcassets: the Linumic monogram, drawn by tools/design/make_app_icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
